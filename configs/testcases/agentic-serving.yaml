name: agentic-serving
description: "Agentic serving with tool-calling (Qwen3-4B-Instruct-2507), single GPU, 1 replica"
model:
  name: Qwen/Qwen3-4B-Instruct-2507
  uri: hf://Qwen/Qwen3-4B-Instruct-2507
  displayName: qwen3-4b-instruct-2507-agentic-serving
  category: agentic-serving
  cache:
    enabled: true
    storageSize: 20Gi
    keepPVC: true
    timeout: 15m
deployment:
  manifestPath: tool-calling.yaml
  requiresGpu: true
  readyTimeout: 15m
validation:
  healthEndpoint: /health
  healthPort: 8000
  healthScheme: HTTPS
  inferenceCheck: true
  toolCallMaxTokens: 1024
  chatPrompts:
    - system: "You are a helpful assistant with access to tools."
      user: "What is the weather in San Francisco right now?"
      tools:
        - type: function
          function:
            name: get_weather
            description: "Get the current weather for a given location"
            parameters:
              type: object
              properties:
                location:
                  type: string
                  description: "City and state, e.g. San Francisco, CA"
              required:
                - location
  expectedCodes: [200]
  timeout: 2m
  retryAttempts: 3
  retryInterval: 15s
  metricsCheck:
    enabled: true
    checkVLLM: true
    checkScheduler: true
cleanup: true
